name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 替换Conda为清华源，解决官方源超时
      - name: Configure Conda mirror
        run: |
          conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/
          conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/r/
          conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/msys2/
          conda config --set show_channel_urls yes

      # 安装系统依赖（ffmpeg）
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      # 安装Python依赖（无environment.yml，全程基于requirements.txt）
      - name: Install dependencies
        run: |
          conda create -n app_env python=3.10 -y
          conda run -n app_env pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple
          conda run -n app_env pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      # 代码检查（flake8）
      - name: Lint with flake8
        run: |
          conda run -n app_env pip install flake8 -i https://pypi.tuna.tsinghua.edu.cn/simple
          conda run -n app_env flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          conda run -n app_env flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
