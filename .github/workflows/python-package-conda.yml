name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
      # 1. 检出仓库代码到GitHub Actions环境
      - uses: actions/checkout@v4

      # 2. 配置Python 3.10环境
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 初始化Conda（解决环境激活问题）
      - name: Initialize Conda
        run: |
          echo ". $CONDA/etc/profile.d/conda.sh" >> ~/.bashrc
          source ~/.bashrc
          conda config --set always_yes yes --set changeps1 no

      # 4. 安装系统依赖（ffmpeg）
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      # 5. 安装Python依赖（无environment.yml依赖）
      - name: Install dependencies
        run: |
          # 创建独立Conda环境
          conda create -n app_env python=3.10 -y
          # 升级pip并安装requirements.txt中的依赖
          conda run -n app_env pip install --upgrade pip
          conda run -n app_env pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      # 6. 代码检查（flake8）
      - name: Lint with flake8
        run: |
          conda run -n app_env pip install flake8
          conda run -n app_env flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          conda run -n app_env flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
