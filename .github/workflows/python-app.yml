name: Python Application (Streamlit)

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4

      # 2. 配置Conda（关键修正：指定正确Python版本，关闭自动创建test环境）
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          python-version: "3.10"  # 明确指定3.10，避免解析成3.1
          conda-version: "latest"
          auto-activate-base: true  # 激活base环境，不创建test环境
          auto-update-conda: true
          channels: conda-forge,defaults
          channel-priority: strict

      # 3. 安装系统依赖（ffmpeg）
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
        shell: bash

      # 4. 安装Python依赖（用base环境，清华源加速）
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
        shell: bash -l {0}  # 必须加-l，确保conda环境生效

      # 5. 代码检查（flake8）
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        shell: bash -l {0}
